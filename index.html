<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ridezilla | Electric Rides With CO₂ Savings</title>
    <meta
      name="description"
      content="Book electric cars, e-bikes and e-rickshaws in Punjab, Chandigarh and Panchkula, and see the CO₂ you save on every ride."
    />
    <meta name="color-scheme" content="dark" />
    <script>
      // Apply the saved theme before the first paint, so a light page does not flash dark.
      try {
        if (localStorage.getItem("ridezilla.theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#07090B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
